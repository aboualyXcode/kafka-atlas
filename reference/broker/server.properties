# A self-managed KRaft broker (not a controller). Kafka 4.x; adjust names and addresses.
process.roles=broker
node.id=4
controller.quorum.bootstrap.servers=controller-1:9093,controller-2:9093,controller-3:9093
controller.listener.names=CONTROLLER

# One listener per network, each advertising an address that is valid on that network.
listeners=INTERNAL://:9092,EXTERNAL://:9094
advertised.listeners=INTERNAL://kafka-4.internal:9092,EXTERNAL://kafka-4.example.com:9094
listener.security.protocol.map=CONTROLLER:SSL,INTERNAL:SSL,EXTERNAL:SASL_SSL
inter.broker.listener.name=INTERNAL

# Rack awareness: replicas of each partition land in different zones.
broker.rack=euw1-az1
log.dirs=/var/lib/kafka/data

# Safe defaults for every topic.
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
unclean.leader.election.enable=false
auto.create.topics.enable=false
auto.leader.rebalance.enable=true

# Retention and replication.
log.retention.hours=168
replica.lag.time.max.ms=30000
num.replica.fetchers=4
