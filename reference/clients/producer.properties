# Production producer settings (orders-service). See the atlas: Operations, client contract.
bootstrap.servers=b-1.orders.example:9098,b-2.orders.example:9098,b-3.orders.example:9098
client.id=orders-service

# Durability: acknowledged only when every in-sync replica has the record; retries never duplicate.
acks=all
enable.idempotence=true
max.in.flight.requests.per.connection=5

# Longer than a leader failover, so a broker restart does not lose records.
delivery.timeout.ms=120000
request.timeout.ms=30000

# Fewer, larger requests: saves broker threads, network and disk.
linger.ms=10
batch.size=65536
compression.type=zstd
max.request.size=1048576

# Amazon MSK with IAM access control (needs the aws-msk-iam-auth library on the classpath).
security.protocol=SASL_SSL
sasl.mechanism=AWS_MSK_IAM
sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
