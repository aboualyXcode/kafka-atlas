# Production consumer settings (billing). See the atlas: Operations, client contract.
bootstrap.servers=b-1.orders.example:9098,b-2.orders.example:9098,b-3.orders.example:9098
client.id=billing
group.id=billing

# Static membership: a restarting instance keeps its partitions, so rolling deploys do not rebalance.
# Must be unique and stable per instance (for example the pod ordinal).
group.instance.id=billing-0

# Commit after processing; never reset silently to the end of the log.
enable.auto.commit=false
auto.offset.reset=none

# The poll loop must finish within the interval: max.poll.records x slowest time per record.
max.poll.records=100
max.poll.interval.ms=300000
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

isolation.level=read_committed
# Read from a replica in the same Availability Zone (zone ID, as MSK reports it).
client.rack=euw1-az1

security.protocol=SASL_SSL
sasl.mechanism=AWS_MSK_IAM
sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
