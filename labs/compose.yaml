# A three-node KRaft cluster for the labs. Every node is both broker and controller, so stopping
# one keeps a quorum and stopping two does not. Needs Docker with the compose plugin.
#   docker compose -f labs/compose.yaml up -d
#   docker compose -f labs/compose.yaml down -v
x-kafka: &kafka
  image: apache/kafka:4.0.0
  environment: &env
    CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,HOST://localhost:9092"
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,HOST://localhost:9094"
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9096:9092"]
    environment:
      <<: *env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,HOST://localhost:9096"
